<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rent Car - Aplikasi Konsumen</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --bg-color: #f4f7f6;
            --text-dark: #2d3748;
            --text-gray: #718096;
            --white: #ffffff;
            --accent: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            padding: 20px 20px 30px;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        .user-greeting {
            font-size: 18px;
            font-weight: 600;
        }

        .user-greeting span { font-size: 13px; font-weight: 400; display: block; opacity: 0.9; }

        /* Main Content Area */
        .content-area {
            flex: 1;
            padding: 20px;
            padding-bottom: 90px; /* Space for bottom nav */
            overflow-y: auto;
        }

        /* View Panels */
        .view-panel { display: none; animation: fadeIn 0.3s; }
        .view-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Card Kendaraan */
        .car-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .car-card:active { transform: scale(0.98); }

        .car-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #cbd5e1;
        }

        .car-details { padding: 15px; }
        .car-title { font-size: 16px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
        .car-specs { font-size: 12px; color: var(--text-gray); margin-bottom: 12px; display: flex; gap: 10px; }
        .car-price { font-size: 16px; font-weight: 700; color: var(--primary); }
        
        .btn-book {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: var(--text-gray);
            cursor: pointer;
            flex: 1;
            font-size: 12px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-item i { font-size: 20px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--primary); }

        /* Form Booking & Form Elements */
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 14px; background: var(--white); }
        .form-control:focus { border-color: var(--primary); }
        
        /* Order History Card */
        .order-card { background: var(--white); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .order-status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
        .status-pending { background: #fffbeb; color: #f59e0b; }
        .status-aktif { background: #ecfdf5; color: #10b981; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER -->
        <div class="top-header">
            <div class="user-greeting">
                Halo, <span id="userNameDisplay" style="font-size: 18px; font-weight: 700;">Memuat...</span>
                <span>Mau sewa mobil apa hari ini?</span>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-area">
            
            <!-- 1. BERANDA (DAFTAR MOBIL) -->
            <div id="view-home" class="view-panel active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="font-size: 16px; font-weight: 700;">Armada Tersedia</h3>
                </div>
                <div id="carListContainer">
                    <p style="text-align: center; color: var(--text-gray); font-size: 13px; margin-top: 20px;">Memuat armada kendaraan...</p>
                </div>
            </div>

            <!-- 2. FORM BOOKING (CHECKOUT) -->
            <div id="view-checkout" class="view-panel">
                <button onclick="switchTab('home')" style="background: none; border: none; color: var(--primary); font-weight: 600; margin-bottom: 15px; cursor: pointer;">
                    <i class="fas fa-arrow-left"></i> Kembali
                </button>
                
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 15px;">Detail Pesanan</h3>
                
                <div id="checkoutCarInfo" class="car-card" style="margin-bottom: 20px;">
                    <!-- Diisi via JS -->
                </div>

                <form id="bookingForm" onsubmit="handleBooking(event)">
                    <div class="form-group">
                        <label class="form-label">Nomor WhatsApp Aktif</label>
                        <input type="tel" id="bookPhone" class="form-control" placeholder="Contoh: 081234567890" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tanggal Mulai Sewa</label>
                        <input type="date" id="bookStartDate" class="form-control" required onchange="calculateTotal()">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tanggal Selesai Sewa</label>
                        <input type="date" id="bookEndDate" class="form-control" required onchange="calculateTotal()">
                    </div>
                    
                    <div style="background: #eef2f5; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600; font-size: 14px;">Total Bayar:</span>
                        <span id="totalPaymentDisplay" style="font-weight: 700; font-size: 18px; color: var(--primary);">Rp 0</span>
                    </div>

                    <button type="submit" class="btn-book" style="padding: 14px; font-size: 16px;">Konfirmasi Pesanan</button>
                </form>
            </div>

            <!-- 3. PESANAN SAYA -->
            <div id="view-orders" class="view-panel">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 15px;">Riwayat Pesanan Saya</h3>
                <div id="orderListContainer">
                    <p style="text-align: center; color: var(--text-gray); font-size: 13px;">Belum ada pesanan.</p>
                </div>
            </div>

            <!-- 4. PROFIL -->
            <div id="view-profile" class="view-panel">
                <div style="text-align: center; margin-top: 20px; margin-bottom: 30px;">
                    <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 15px;">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="profileName" style="font-size: 18px; font-weight: 700;">-</h3>
                    <p id="profileEmail" style="font-size: 13px; color: var(--text-gray);">-</p>
                </div>

                <button onclick="logoutKonsumen()" style="width: 100%; padding: 12px; background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; border-radius: 10px; font-weight: 600; cursor: pointer;">
                    <i class="fas fa-sign-out-alt"></i> Keluar Akun
                </button>
            </div>

        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home', this)">
                <i class="fas fa-home"></i> Beranda
            </div>
            <div class="nav-item" onclick="switchTab('orders', this)">
                <i class="fas fa-clipboard-list"></i> Pesanan
            </div>
            <div class="nav-item" onclick="switchTab('profile', this)">
                <i class="fas fa-user"></i> Profil
            </div>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { collection, onSnapshot, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        let currentUser = null;
        let vehiclesList = [];
        let priceList = [];
        let selectedCarForBooking = null;

        // AUTHENTICATION CHECK
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index_2.html";
            } else {
                currentUser = user;
                document.getElementById('userNameDisplay').innerText = user.displayName || 'Pengguna';
                document.getElementById('profileName').innerText = user.displayName || 'Pengguna';
                document.getElementById('profileEmail').innerText = user.email || '-';
                loadMyOrders(); // Load user specific orders
            }
        });

        // TAB SWITCHER
        window.switchTab = function(tabId, element = null) {
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');

            if (element) {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                element.classList.add('active');
            }
        };

        // REALTIME LISTENER: KENDARAAN & HARGA
        onSnapshot(collection(db, "vehicles"), (snapshot) => {
            vehiclesList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderCars();
        });

        onSnapshot(collection(db, "prices"), (snapshot) => {
            priceList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderCars();
        });

        // TAMPILKAN DAFTAR MOBIL DI BERANDA
        function renderCars() {
            const container = document.getElementById('carListContainer');
            container.innerHTML = "";

            if (vehiclesList.length === 0) {
                container.innerHTML = "<p style='text-align:center; font-size:13px;'>Belum ada kendaraan yang tersedia.</p>";
                return;
            }

            vehiclesList.forEach(car => {
                const priceData = priceList.find(p => String(p.vehicleId) === String(car.id));
                const hargaSewa = priceData ? priceData.hargaSewa : 0;
                const photo = (car.photos && car.photos.length > 0) ? car.photos[0] : "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=400&auto=format&fit=crop&q=60";

                container.innerHTML += `
                    <div class="car-card">
                        <img src="${photo}" class="car-img" alt="Mobil">
                        <div class="car-details">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div>
                                    <h3 class="car-title">${car.merek} ${car.tipe}</h3>
                                    <div class="car-specs">
                                        <span><i class="fas fa-users"></i> ${car.kapasitas || '-'}</span>
                                        <span><i class="fas fa-cogs"></i> ${car.tahun || '-'}</span>
                                    </div>
                                </div>
                                <div style="text-align: right;">
                                    <div class="car-price">Rp ${hargaSewa.toLocaleString('id-ID')}</div>
                                    <span style="font-size: 10px; color: var(--text-gray);">/ hari</span>
                                </div>
                            </div>
                            <button class="btn-book" onclick='openCheckout(${JSON.stringify(car)}, ${hargaSewa}, "${photo}")'>Pesan Sekarang</button>
                        </div>
                    </div>
                `;
            });
        }

        // BUKA HALAMAN CHECKOUT
        window.openCheckout = function(car, hargaSewa, photo) {
            if (hargaSewa === 0) {
                Swal.fire('Informasi', 'Harga sewa untuk kendaraan ini belum diatur oleh Admin.', 'info');
                return;
            }

            selectedCarForBooking = { ...car, hargaSewa };
            
            document.getElementById('checkoutCarInfo').innerHTML = `
                <div style="display:flex; gap:15px; align-items:center;">
                    <img src="${photo}" style="width: 80px; height: 60px; border-radius: 8px; object-fit:cover;">
                    <div>
                        <h4 style="font-size:15px; font-weight:700; margin-bottom:4px;">${car.merek} ${car.tipe}</h4>
                        <p style="font-size:12px; color:var(--text-gray);">Biaya: Rp ${hargaSewa.toLocaleString('id-ID')} / hari</p>
                    </div>
                </div>
            `;
            
            document.getElementById('totalPaymentDisplay').innerText = "Rp 0";
            document.getElementById('bookingForm').reset();
            switchTab('checkout');
        };

        // KALKULASI TOTAL BAYAR
        window.calculateTotal = function() {
            const start = document.getElementById('bookStartDate').value;
            const end = document.getElementById('bookEndDate').value;
            
            if (start && end && selectedCarForBooking) {
                const date1 = new Date(start);
                const date2 = new Date(end);
                const diffTime = Math.abs(date2 - date1);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // +1 supaya sewa hari yang sama dihitung 1 hari

                if (date2 < date1) {
                    Swal.fire('Peringatan', 'Tanggal selesai tidak boleh lebih kecil dari tanggal mulai.', 'warning');
                    document.getElementById('totalPaymentDisplay').innerText = "Rp 0";
                    return;
                }

                const total = diffDays * selectedCarForBooking.hargaSewa;
                document.getElementById('totalPaymentDisplay').innerText = "Rp " + total.toLocaleString('id-ID');
            }
        };

        // PROSES PESANAN KE FIRESTORE
        window.handleBooking = async function(e) {
            e.preventDefault();
            
            if (!currentUser || !selectedCarForBooking) return;

            const start = document.getElementById('bookStartDate').value;
            const end = document.getElementById('bookEndDate').value;
            const phone = document.getElementById('bookPhone').value;

            const diffDays = Math.ceil(Math.abs(new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)) + 1;
            const totalBayar = diffDays * selectedCarForBooking.hargaSewa;

            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = "Memproses...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "orders"), {
                    userId: currentUser.uid,
                    namaKonsumen: currentUser.displayName || "Konsumen",
                    noHp: phone,
                    vehicleId: selectedCarForBooking.id,
                    merek: selectedCarForBooking.merek,
                    tipe: selectedCarForBooking.tipe,
                    noPolisi: selectedCarForBooking.noPolisi,
                    tanggalMulai: start,
                    tanggalSelesai: end,
                    totalHarga: totalBayar,
                    status: "Pending", // Admin yang mengubah jadi Aktif/Disewakan
                    createdAt: serverTimestamp(),
                    hariIndex: new Date(start).getDay() - 1 < 0 ? 6 : new Date(start).getDay() - 1
                });

                // Tambahkan Booking ke kalender (simpel)
                await addDoc(collection(db, "bookings"), {
                    tanggal: start,
                    vehicleId: selectedCarForBooking.id
                });

                Swal.fire('Berhasil!', 'Pesanan Anda telah diterima. Admin akan segera menghubungi Anda.', 'success');
                switchTab('orders');
                
            } catch (err) {
                Swal.fire('Gagal', 'Terjadi kesalahan sistem: ' + err.message, 'error');
            } finally {
                btn.innerHTML = "Konfirmasi Pesanan";
                btn.disabled = false;
            }
        };

        // LOAD PESANAN SAYA
        function loadMyOrders() {
            const q = query(collection(db, "orders"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('orderListContainer');
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='text-align:center; font-size:13px; color:var(--text-gray);'>Belum ada pesanan yang dibuat.</p>";
                    return;
                }

                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    let statusClass = data.status === 'Aktif' || data.status === 'Disewakan' ? 'status-aktif' : 'status-pending';

                    container.innerHTML += `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <span class="order-status ${statusClass}">${data.status}</span>
                                <span style="font-size:11px; color:var(--text-gray);">${data.tanggalMulai}</span>
                            </div>
                            <h4 style="font-size:15px; margin-bottom:4px;">${data.merek} ${data.tipe}</h4>
                            <p style="font-size:12px; color:var(--text-gray);">Tanggal Sewa: ${data.tanggalMulai} s/d ${data.tanggalSelesai}</p>
                            <div style="border-top:1px dashed #e2e8f0; margin-top:10px; padding-top:10px; text-align:right;">
                                <span style="font-size:12px; color:var(--text-gray);">Total: </span>
                                <span style="font-size:15px; font-weight:700; color:var(--primary);">Rp ${Number(data.totalHarga).toLocaleString('id-ID')}</span>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // LOGOUT
        window.logoutKonsumen = function() {
            Swal.fire({
                title: 'Keluar?',
                text: "Anda yakin ingin keluar dari aplikasi?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#1e3c72',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'Ya, Keluar'
            }).then((result) => {
                if (result.isConfirmed) {
                    signOut(auth).then(() => {
                        window.location.href = "index_2.html";
                    });
                }
            });
        };
    </script>
</body>
</html>
